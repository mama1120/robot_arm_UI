kinematics_solver_plugins:
  # <plugin_key>: "<fully_qualified_class>"
  robot_robot_arm: "robot_robot_arm::IKFastKinematicsPlugin"
  
robot_arm:
  kinematics_solver: robot_robot_arm/IKFastKinematicsPlugin
  kinematics_solver_search_resolution: 0.0050000000000000001
  kinematics_solver_timeout: 0.0050000000000000001
  # (optional) tuning parameters
  kinematics_solver_search_resolution: 0.005
  kinematics_solver_timeout: 0.01

  # must match exactly what you used when generating IKFast
  base_link: "base_link"
  tip_link:  "link4_1"

  # (optional) specify the IK type if you like
  ik_type: "TranslationYAxisAngle4D"